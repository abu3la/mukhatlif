<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>فحص الجوال المحلي</title>
    <style>
      body {
        margin: 0;
        background: #272925;
        display: grid;
        justify-content: center;
      }
      iframe {
        border: 0;
        width: 390px;
        height: 844px;
        background: white;
      }
    </style>
  </head>
  <body>
    <iframe title="معاينة الجوال" src="/courses"></iframe>
    <script>
      const path = new URLSearchParams(location.search).get('path');
      if (path && /^\/(courses|library)(\/|$)/.test(path))
        document.querySelector('iframe').src = path;
    </script>
  </body>
</html>
